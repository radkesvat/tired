name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: linux-clang-${{ matrix.target.arch }}-${{ matrix.configuration }}-${{ matrix.mode }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
        mode: [DIRECT, DISTRIBUTION]
        target:
          - { arch: x64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld cmake ninja-build binutils pkg-config libjson-c-dev libssl-dev
      - name: Configure
        run: cmake --preset linux-clang-${{ matrix.target.arch }}-${{ matrix.configuration }} -DTIRED_DEPENDENCY_MODE=${{ matrix.mode }}
      - name: Build and verify linkage
        run: cmake --build --preset linux-clang-${{ matrix.target.arch }}-${{ matrix.configuration }} --parallel 2
      - name: Smoke test
        run: ctest --preset linux-clang-${{ matrix.target.arch }}-${{ matrix.configuration }}
      - name: Stage installation
        run: cmake --install build/linux-clang-${{ matrix.target.arch }}-${{ matrix.configuration }}
      - name: Package development archive
        working-directory: build/linux-clang-${{ matrix.target.arch }}-${{ matrix.configuration }}
        run: cpack -G TGZ
      - name: Upload development artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tired-linux-clang-${{ matrix.target.arch }}-${{ matrix.configuration }}-${{ matrix.mode }}
          path: build/linux-clang-${{ matrix.target.arch }}-${{ matrix.configuration }}/tired-*.tar.gz
          if-no-files-found: error
